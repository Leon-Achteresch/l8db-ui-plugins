name: Publish catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run catalog
      - name: Write dist to the catalog branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir publish
          cd publish
          git init -q -b catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin catalog; then git reset -q --soft FETCH_HEAD; fi
          cp -R ../dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          git commit -qm "Catalog from ${GITHUB_SHA::7}"
          git push -q origin catalog
